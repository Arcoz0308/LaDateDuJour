services:
  ladatedujour:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify injects these from its Environment Variables panel. Locally,
    # Docker Compose reads the same values from a .env file automatically.
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CHANNEL_ID: ${CHANNEL_ID:-}
      ROLE_ID: ${ROLE_ID:-}
      DEBUG_MODE: ${DEBUG_MODE:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-0}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-http://localhost:11434}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-gemma2}
      LOCAL_AI_TYPE: ${LOCAL_AI_TYPE:-ollama}
    volumes:
      # Keeps SQLite configuration, cache and birthdays across redeployments.
      - ladatedujour-data:/app/data

volumes:
  ladatedujour-data:
